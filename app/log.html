<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111113">
<title>Effective sets</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="log.css">
</head>
<body>
  <header class="top">
    <a href="index.html" class="back" data-i18n-aria="log.back">←</a>
    <label class="date">
      <span id="dateLabel"></span>
      <input type="date" id="date">
    </label>
    <span class="total" id="total"></span>
  </header>

  <main>
    <ul class="rows" id="rows"></ul>
    <p class="empty muted" id="empty" data-i18n="log.empty"></p>

    <section class="add">
      <input type="search" id="search" autocomplete="off" enterkeyhint="search" data-i18n-placeholder="log.addPlaceholder">
      <ul class="results" id="results"></ul>
    </section>
  </main>

  <footer class="bottom">
    <a class="btn-primary" id="finish" href="card.html" data-i18n="log.finish"></a>
    <a class="csv muted" id="csv" download="session_log.csv" data-i18n="log.csv"></a>
  </footer>

<script type="module" src="log.js"></script>
</body>
</html>
